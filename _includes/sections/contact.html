<div class="container" id="contact">
  <div class="row m-b-lg">
    <div class="col-sm-8 col-sm-offset-2 text-center">
      <div class="navy-line"></div>
      <h2 data-i18n="contact.title">Contacto</h2>
      <p data-i18n="contact.desc">If you have a question or proposal, leave me a message</p>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-6 col-sm-offset-3">
      <form action="https://formspree.io/f/TU_ID_AQUI" method="POST">
        <div class="form-group">
          <input type="email" name="email" class="form-control" placeholder="Tu correo" required style="margin-bottom: 15px; padding: 10px;">
        </div>
        <div class="form-group">
          <textarea name="message" class="form-control" rows="5" placeholder="Tu mensaje" required style="margin-bottom: 15px; padding: 10px;"></textarea>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary" data-i18n="contact.button">Enviar</button>
        </div>
      </form>
    </div>
  </div>
</div>
